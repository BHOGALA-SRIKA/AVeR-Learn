# Does glossary expansion help once the glossary is frozen to textbook terms? (Hemanth asked, 2026-10-31)
# Run:  python -m src.evaluation.evaluate_retrieval experiments/configs/glossary_frozen_ablation.yaml
name: glossary_frozen_ablation
corpus: data/processed/corpus_unit1.json
questions: data/benchmark/questions.json
split: dev
ks: [1, 3, 5, 10]
primary_metric: nDCG@10
significance_metrics: [nDCG@10, R@5, MRR@10]
budgets: [256, 512, 1024]
baseline: bm25f               # the decision: bm25f with or without expansion
efficiency: true
efficiency_repeats: 5
runs:
  - {method: bm25f}
  - {method: bm25f, expand: true}
  - {method: bm25}
  - {method: bm25, expand: true}
  - {method: char_tfidf}
  - {method: char_tfidf, expand: true}
  - {method: rrf}
  - {method: rrf, expand: true}
